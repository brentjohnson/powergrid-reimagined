[workspace]
members = [
    "crates/powergrid-core",
    "crates/powergrid-client",
    "crates/powergrid-bot-strategy",
    "crates/powergrid-session",
    "crates/powergrid-lobby",
    "crates/powergrid-py",
    "crates/powergrid-maptool",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
