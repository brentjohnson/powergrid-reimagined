# Bot difficulty profiles.
# All values under [normal] reproduce the original hard-coded constants exactly.
# Change weights here without recompiling to experiment with bot behaviour.

# ---------------------------------------------------------------------------
# Easy — weaker, more random play for beginners to practice against.
# ---------------------------------------------------------------------------

[easy]
display_name = "Easy"
temperature  = 2.0   # Boltzmann sampling: occasionally picks 2nd/3rd best action
jitter       = 0.5   # 50% chance of bid jitter
max_jitter   = 5     # up to +5 elektro above ceiling

[easy.auction]
# Elektro-denominated valuation weights (see LOGIC.md / evaluate_plant). Every
# plant is valued in expected future Elektro; MaximumBid = PlantValue.
city_reserve        = 30.0   # ~2 city builds kept in reserve
safety_buffer       = 5.0
upgrade_margin      = 10.0   # lower = replaces rack plants for smaller Elektro gains (wastes money)
min_open_score      = 10.0   # lower = opens auctions on lower-value plants (less disciplined)
buildable_lookahead = 3      # cities beyond owned counted as "usefully planned for" (relaxed for easy)
endgame_weight            = 5.0    # mild reward for capacity that closes the gap to end_game_cities
denial_weight             = 0.0    # opponent-blind — no denial bidding
operating_cost_weight     = 1.0    # net out forward fuel spend (demand+replenishment aware) — fuel type matters
fuel_risk_weight          = 1.0    # mild Elektro penalty for thirsty plants on scarce fuel
# replacement_waste partially double-counts the forced discard (capacity_bump
# already nets it out of incremental_income), so it's kept small across all
# tiers — a conservatism knob, not a full second charge.
replacement_waste_weight  = 0.25   # mild penalty for discarding a plant that still earns

[easy.buy]
fuel_reserve_multiplier = 4.0
stockpile_rounds = 1.0          # reactive — buy only the coming firing, no stockpiling

[easy.build]
block_weight = 0.0

[easy.bureaucracy]
oil_preference = 1.0   # 1.0 = always prefer oil for hybrids (conserves coal)

# ---------------------------------------------------------------------------
# Normal — matches the original hand-coded logic exactly.
# ---------------------------------------------------------------------------

[normal]
display_name = "Normal"
temperature  = 0.0  # pure argmax — deterministic best choice
jitter       = 0.3  # ~30% chance of bid jitter
max_jitter   = 3    # up to +3 elektro above ceiling

[normal.auction]
city_reserve        = 30.0   # ~2 city builds kept in reserve
safety_buffer       = 5.0
upgrade_margin      = 20.0   # minimum PlantValue (Elektro) to justify replacing a rack plant
min_open_score      = 20.0   # minimum PlantValue (Elektro) for a plant to be worth selecting
buildable_lookahead = 2      # cities beyond owned counted as "usefully planned for"
endgame_weight            = 10.0   # reward for capacity that closes the gap to end_game_cities
denial_weight             = 0.0    # opponent-blind — no denial bidding
operating_cost_weight     = 1.0    # net out forward fuel spend (demand+replenishment aware) — fuel type matters
fuel_risk_weight          = 2.0    # Elektro penalty for thirsty plants on scarce/contested fuel
replacement_waste_weight  = 0.5    # penalty for discarding a plant that still has income to earn (kept small — see [easy.auction])

[normal.buy]
fuel_reserve_multiplier = 4.0   # spend 4× plant cost on fuel reserves
stockpile_rounds = 1.0          # reactive — buy only the coming firing, no stockpiling

[normal.build]
block_weight = 0.0

[normal.bureaucracy]
oil_preference = 1.0

# ---------------------------------------------------------------------------
# Hard — deterministic best-move with opponent and endgame awareness.
# ---------------------------------------------------------------------------

[hard]
display_name = "Hard"
temperature  = 0.0   # pure argmax
jitter       = 0.15  # less bid noise — tighter, harder to read
max_jitter   = 2

# 2026-07-10: weights below were found by powergrid-evolve (CMA-ES, 200 gens vs
# normal bots, paired jitter=0). On held-out seeds this beats the old hand-tuned
# hard by ~+19-28pp (vs 3 normal 30.8%→50.2%, vs 3 hard 25.0%→53.4%), winning by
# building/powering MORE cities and ending sooner — auction discipline, not
# hoarding. The theme: reserve cash for cities+fuel (high reserves), only bid on
# clearly-worth-it plants (high thresholds), keep plants fed (high fuel reserve),
# and skip opponent-interference features (denial/block off). See RL-TRAINING-JOURNAL.md.
[hard.auction]
city_reserve        = 100.0  # reserve lots of cash for cities/fuel — don't overpay at auction
safety_buffer       = 40.0
upgrade_margin      = 60.0   # only replace a rack plant for a large Elektro gain
min_open_score      = 60.0   # only open auctions on clearly valuable plants (avoid bidding wars)
buildable_lookahead = 2
endgame_weight            = 22.8138  # strongly rewards capacity that closes the gap to end_game_cities
denial_weight             = 0.0      # opponent-denial not worth it vs these bots
operating_cost_weight     = 0.6511   # net out forward fuel spend (demand+replenishment aware)
fuel_risk_weight          = 7.9886   # heavy penalty for thirsty plants on scarce/contested fuel
replacement_waste_weight  = 0.0

[hard.buy]
fuel_reserve_multiplier = 10.0  # keep plants well fed so powered-city count is maximized
stockpile_rounds = 1.0          # no pre-buy stockpiling (buy only the coming firing)

[hard.build]
block_weight = 0.0   # don't chase contested cities — just race your own board

[hard.bureaucracy]
oil_preference = 0.0  # prefer gas for hybrids (conserve oil)

# Expert is driven by the RL policy (assets/policies/expert.bin), not these
# weights. This profile is the fallback used when the policy is unavailable
# (non-default map, missing/corrupt weights) and for the client's bot
# valuation popup. Weights are a copy of [hard].
[expert]
display_name = "Expert"
temperature  = 0.0
jitter       = 0.15
max_jitter   = 2

[expert.auction]
city_reserve        = 100.0
safety_buffer       = 40.0
upgrade_margin      = 60.0
min_open_score      = 60.0
buildable_lookahead = 2
endgame_weight            = 22.8138
denial_weight             = 0.0
operating_cost_weight     = 0.6511
fuel_risk_weight          = 7.9886
replacement_waste_weight  = 0.0

[expert.buy]
fuel_reserve_multiplier = 10.0
stockpile_rounds = 1.0

[expert.build]
block_weight = 0.0

[expert.bureaucracy]
oil_preference = 0.0
