[package]
name = "powergrid-client"
version = "0.1.0"
edition = "2021"

[dependencies]
powergrid-core = { path = "../powergrid-core" }
powergrid-session = { path = "../powergrid-session" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.33"
egui_extras = { version = "0.33", features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
crossbeam-channel = "0.5"
tokio-tungstenite = "0.24"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
directories = "5"
rodio = { version = "0.20", default-features = false, features = ["vorbis"] }
